# Starship - liquidshell (generated by matugen, re-themed on wallpaper change)
palette = "matugen"
add_newline = true
# Directory scan budget (default 30ms warns in huge/slow dirs)
scan_timeout = 200
continuation_prompt = "[▸▹ ](matugen_outline)"

format = """$username$hostname$directory$git_branch$git_status$nodejs$python$rust$golang$fill$cmd_duration$line_break$jobs$character"""

right_format = """$battery$time"""

[palettes.matugen]
primary = "{{colors.primary.default.hex}}"
secondary = "{{colors.secondary.default.hex}}"
tertiary = "{{colors.tertiary.default.hex}}"
error = "{{colors.error.default.hex}}"
outline = "{{colors.outline.default.hex}}"
surface = "{{colors.surface_container.default.hex}}"
on_surface = "{{colors.on_surface.default.hex}}"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold matugen_primary"
read_only = " 󰌾"
read_only_style = "matugen_error"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold matugen_secondary"
truncation_length = 32
format = "[$symbol$branch]($style) "

[git_status]
style = "bold matugen_tertiary"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked = "?${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "
conflicted = "=${count} "
stashed = "↩${count} "

[nodejs]
style = "matugen_secondary"
format = "[via $symbol($version )]($style) "

[python]
style = "matugen_tertiary"
format = "[via $symbol($version )(\\\\($virtualenv\\\\) )]($style) "

[rust]
style = "matugen_error"
format = "[via $symbol($version )]($style) "

[golang]
style = "matugen_primary"
format = "[via $symbol($version )]($style) "

[username]
style_user = "bold matugen_primary"
style_root = "bold matugen_error"
format = "[$user]($style) "

[hostname]
style = "bold matugen_secondary"
format = "[@$hostname]($style) "

[cmd_duration]
min_time = 2000
style = "matugen_tertiary"
format = "took [$duration]($style) "

[jobs]
symbol = " "
style = "matugen_secondary"
format = "[$symbol$number]($style) "

[battery]
full_symbol = "\\U0000F240 "
charging_symbol = "\\U0000F240 "
discharging_symbol = "\\U0000F242 "
unknown_symbol = "\\U0000F241 "
empty_symbol = "\\U0000F244 "
format = "[$symbol$percentage]($style) "
display = [{ threshold = 100, style = "bold matugen_tertiary" }]

[time]
disabled = false
time_format = "%H:%M"
style = "matugen_outline"
format = "[$time]($style) "

[character]
success_symbol = "[❯](bold matugen_primary)"
error_symbol = "[❯](bold matugen_error)"

[fill]
symbol = " "
style = ""
