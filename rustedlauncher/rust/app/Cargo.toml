[package]
name = "rustedlauncher"
description = "A minimal wofi/rofi-style application launcher for Hyprland, in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rustedlauncher"
path = "src/main.rs"

[dependencies]
launcher-core = { path = "../units/launcher-core" }
gtk = { package = "gtk4", version = "0.11.5" }
gtk4-layer-shell = "0.9.0"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
