# foot - liquidshell (font/padding/cursor here; colors come from matugen -> colors.ini)
# Alacritty-like: transparent, size 12, underline cursor, deep scrollback.
# Run as server (foot --server at login) + footclient per window to share
# font/glyph cache between windows and keep memory low.
include=~/.config/foot/colors.ini

[main]
term=xterm-256color
font=JetBrainsMono Nerd Font:size=12
pad=6x6 center

[scrollback]
lines=10000

[cursor]
style=block
blink=yes
